<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor Closet</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="manager.css">
  <style id="pg-style"></style>
</head>
<body>
  <div class="page">
    <header class="top">
      <div class="brand"><img src="icons/icon-32.png" width="26" height="26" alt=""> Cursor Closet</div>
      <div class="power">
        <span class="note" id="powerNote"></span>
        <label class="switch">
          <input id="enabled" type="checkbox" role="switch" aria-label="Custom cursors on">
          <span></span>
        </label>
      </div>
    </header>

    <section class="closet">
      <div class="closet-head">
        <div>
          <h1>Your closet</h1>
          <p class="note" id="closetNote"></p>
        </div>
        <div class="closet-actions">
          <button class="btn btn-primary" id="newSet" type="button">+ New set</button>
          <button class="btn" id="importBtn" type="button">Import</button>
        </div>
      </div>
      <ul class="set-list" id="setList"></ul>
    </section>
  </div>

  <dialog class="editor-dialog" id="editorDialog" aria-label="Edit cursor set">
    <div class="editor" id="editor"></div>
  </dialog>

  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status"></div>
  <script src="lib.js"></script>
  <script src="manager.js"></script>
</body>
</html>
